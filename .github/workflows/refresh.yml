name: refresh

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max PDFs to fetch (0 = no limit, full harvest)"
        required: false
        default: "10"
      min_year:
        description: "Only fetch documents posted under this index year or later"
        required: false
        default: "2021"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poppler (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python deps
        run: pip install -r requirements.txt

      # The PDF cache is what keeps us off ARDOT's server. Getting the key
      # wrong is not a performance problem, it is an etiquette problem.
      #
      # The old key was ardot-pdfs-${{ hashFiles('data/manifest.csv') }} with
      # restore-keys: ardot-pdfs-. On the very first run no manifest existed
      # yet, hashFiles returned empty, and the cache was saved under the bare
      # key "ardot-pdfs-". That is an EXACT match for the restore-key, and an
      # exact restore-key match beats every prefix match -- so that first
      # 10-PDF cache permanently shadowed every later one. Four runs in a row
      # restored those same 10 PDFs and re-downloaded everything else.
      #
      # Keying on the manifest was wrong anyway: fetch.py rewrites it with new
      # sha256 values, so the key never matches on the next run by construction.
      #
      # github.run_id is never empty and never repeats, so no cache can collide
      # with the restore-key prefix again. Each run saves a fresh cache and
      # restores the most recent one. The v2 prefix sidesteps the poisoned
      # ardot-pdfs- entry without needing to delete it.
      - name: Restore PDF cache
        uses: actions/cache@v4
        with:
          path: cache
          key: ardot-pdf-cache-v2-${{ github.run_id }}
          restore-keys: ardot-pdf-cache-v2-

      - name: Harvest index
        run: python harvest.py

      # On a schedule event github.event.inputs is null, so interpolating it
      # directly yielded a bare `python fetch.py` -- an unbounded ~700-document
      # fetch, unattended, against a small state agency. The cap below applies
      # whenever no limit was supplied. Raise it once a sample has been
      # hand-checked per the validation gate in CLAUDE.md; dispatch with 0 for
      # a deliberate full harvest.
      - name: Fetch new PDFs
        env:
          DISPATCH_LIMIT: ${{ github.event.inputs.limit }}
          SCHEDULED_LIMIT: "25"
          MIN_INDEX_YEAR: ${{ github.event.inputs.min_year || '2021' }}
        run: |
          LIMIT="${DISPATCH_LIMIT:-$SCHEDULED_LIMIT}"
          if [ "$LIMIT" = "0" ]; then
            echo "limit=0 -- full harvest"
            python fetch.py
          else
            echo "limit=$LIMIT"
            python fetch.py "$LIMIT"
          fi

      - name: Parse
        run: python parse.py

      - name: Commit derived data
        run: |
          git config user.name  "ardot-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            git commit -m "refresh: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-queue
          path: data/review_queue.csv
          if-no-files-found: warn
